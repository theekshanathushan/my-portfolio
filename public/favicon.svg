<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d17"/>
      <stop offset="100%" stop-color="#07070b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.8"/>
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <!-- TT Monogram Text -->
  <text x="50%" y="62%" text-anchor="middle" font-family="'Fira Code', 'Consolas', 'Courier New', monospace" font-size="28" font-weight="800" fill="url(#cyanGrad)" filter="url(#cyanGlow)" letter-spacing="-1">TT</text>
</svg>
